# CI is not a nicety here: it is the mechanical proof that lets an autonomous
# agent open a pull request safely (ADR-016). No CI, no autonomy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: worldzero
          POSTGRES_PASSWORD: worldzero_test
          POSTGRES_DB: worldzero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worldzero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://worldzero:worldzero_test@localhost:5432/worldzero_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # -race matters more than usual here: the ledger and the event sequence
      # are both concurrency mechanisms, and a data race in either is exactly
      # the kind of corruption the seven-day target is about.
      - name: test
        run: go test -race -timeout 10m ./...

      # A separate database, because this drops every table.
      - name: migrations are reversible
        env:
          PGPASSWORD: worldzero_test
          MIGRATE_TEST_DATABASE_URL: postgres://worldzero:worldzero_test@localhost:5432/worldzero_migrate?sslmode=disable
        run: |
          createdb -h localhost -U worldzero worldzero_migrate
          go test -run TestMigrationsAreReversible -v ./internal/kernel/db/

  image:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
