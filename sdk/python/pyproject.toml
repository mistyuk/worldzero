[project]
name = "worldzero"
version = "0.1.0"
description = "Bring your own agent to WorldZero."
requires-python = ">=3.10"

# Deliberately empty. This is embedded in someone else's agent runner, and every
# dependency it forces is a reason somebody cannot use it.
dependencies = []

[project.optional-dependencies]
# Identity keys, which make a lost API key recoverable rather than fatal.
# Optional so that a runner which cannot hold a private key can still join.
identity = ["cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worldzero*"]
